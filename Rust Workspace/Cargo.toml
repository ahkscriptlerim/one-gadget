[package]
name        = "one_gadget"
version     = "1.0.0"
edition     = "2021"
license     = "GPL-2.0-or-later"
default-run = "one_gadget"

[[bin]]
name = "one_gadget"
path = "src/main.rs"

[dependencies]
sysinfo = "0.39"
all-smi = "0.25"

rustc-hash = "2"
# Identity/FNV-family hasher, used by rustc itself.
# Replaces SipHash-1-3 (the default) for proc_ema_map and disk_metrics.
# On typical x86-64: ~3–5× faster map operations for string keys under 64 bytes.

# Windows API bindings
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dxgi", "Win32_Graphics_Gdi", "Win32_Graphics_GdiPlus", "Win32_System_LibraryLoader", "Win32_System_Performance", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_System_Console"] }

[build-dependencies]
winres  = "0.1"

[profile.release]
opt-level     = 3           # Full loop/vectorisation/inlining optimisations
lto           = true        # Full LTO: whole-program global optimization across all crates
codegen-units = 1           # Single CGU → maximum inter-procedural analysis
panic         = "abort"     # No unwind machinery; smaller binary, faster cold paths
strip         = "symbols"   # Strip debuginfo from the distributed binary
